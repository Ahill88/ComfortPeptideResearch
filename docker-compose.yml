services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix_field
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://helix:helix@postgres:5432/helix_field?schema=public
      REDIS_HOST: redis
    depends_on: [postgres, redis]
    ports: ["3001:3001"]
  storefront:
    build: { context: ., dockerfile: apps/storefront/Dockerfile }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { postgres_data: {}, redis_data: {} }
